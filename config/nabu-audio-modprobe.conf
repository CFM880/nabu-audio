# Xiaomi Pad 5 (nabu) audio.
#
# The SLIMbus NGD controller (WCD934x headphone/mic codec bus) only comes up
# when it sees the audio DSP's SSR "power up" notification. If its module is
# loaded after the ADSP has already booted, the event is missed: dmesg never
# shows "SLIM SAT: Rcvd master capability", the card defers on
#   snd-sm8150: SLIM Capture 1: codec dai not found
# and there is no sound card ("Dummy Output"). Load the SLIMbus controller
# before the ADSP loader so it is always listening.
softdep qcom_q6v5_pas pre: slim_qcom_ngd_ctrl
