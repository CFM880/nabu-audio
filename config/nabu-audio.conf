# Xiaomi Pad 5 (nabu) audio.
#
# The four CS35L41 speaker amps sit on I2C and their driver is not loaded
# automatically before the snd-sm8150 machine driver probes, which leaves the
# "Speaker Playback" backend without its codec DAI:
#   platform sound: deferred probe pending: snd-sm8150: Speaker Playback:
#   codec dai not found
# Load the amplifier driver explicitly so the sound card registers at boot.
snd-soc-cs35l41-i2c
