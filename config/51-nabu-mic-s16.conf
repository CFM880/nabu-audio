# Nabu WCD9341 capture: use S16 until the 24-bit alignment is fixed.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.platform-sound.HiFi__Mic__source"
        api.alsa.pcm.stream = "capture"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
